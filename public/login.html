<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Iniciar Sesión - La Pomme Snacks</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --logo-green: #28a745;
            --gold: #d4af37;
            --muted: #666;
            --error: #dc3545;
            --success: #28a745;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Merriweather', serif;
            background: linear-gradient(135deg, #fef7e8 0%, #f5e6d3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            max-width: 580px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 2px solid var(--gold);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-header h1 { font-size: 2rem; margin-bottom: 5px; }
        .login-header p { opacity: 0.9; margin: 0; }
        .login-body { padding: 30px; }
        
        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
            outline: none;
        }
        .form-control.is-invalid {
            border-color: var(--error);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23dc3545'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath stroke-linejoin='round' d='M5.8 3.6h.4L6 6.5z'/%3e%3ccircle cx='6' cy='8.2' r='.6' fill='%23dc3545' stroke='none'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right calc(0.375em + 0.1875rem) center;
            background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
        }
        .form-control.is-valid {
            border-color: var(--success);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%2328a745' d='M2.3 6.73L.6 4.53c-.4-1.04.46-1.4 1.1-.8l1.1 1.4 3.4-3.8c.6-.63 1.6-.27 1.2.7l-4 4.6c-.43.5-.8.4-1.1.1z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right calc(0.375em + 0.1875rem) center;
            background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
        }
        .invalid-feedback, .valid-feedback {
            display: none;
            width: 100%;
            margin-top: 0.25rem;
            font-size: 0.875em;
        }
        .invalid-feedback.show { display: block; color: var(--error); }
        .valid-feedback.show { display: block; color: var(--success); }
        
        .nav-tabs .nav-link {
            border: none;
            font-size: 1rem;
            padding: 12px;
            color: #666;
            transition: all 0.3s ease;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: white;
            border-radius: 12px;
        }
        .nav-tabs .nav-link:not(.active):hover {
            color: var(--gold);
            transform: translateY(-2px);
        }
        
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
            color: white;
        }
        .btn-gold:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }
        
        .strength-meter {
            height: 6px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-meter-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 5px;
        }
        .strength-text {
            font-size: 0.7rem;
            margin-top: 5px;
        }
        
        .field-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            z-index: 10;
        }
        .field-icon:hover { color: var(--gold); }
        .input-group-custom { position: relative; }
        .requirement-list { font-size: 0.7rem; margin-top: 5px; color: var(--muted); }
        .requirement-list i { margin-right: 4px; font-size: 0.6rem; }
        .text-success { color: var(--success) !important; }
        .text-danger { color: var(--error) !important; }
        
        .alert-info {
            background: rgba(212,175,55,0.1);
            border: 1px solid var(--gold);
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .back-link a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link a:hover { color: var(--gold); }
        
        .btn-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tab-pane { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @media (max-width: 576px) {
            .login-container { max-width: 95%; }
            .login-body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-apple-alt fa-3x mb-2"></i>
            <h1>La Pomme Snacks</h1>
            <p>Inicia sesión en tu cuenta</p>
        </div>
        <div class="login-body">
            <ul class="nav nav-tabs mb-4 justify-content-center gap-2" id="loginTabs" role="tablist">
                <li class="nav-item flex-grow-1">
                    <button class="nav-link active fw-bold w-100" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPanel" type="button">
                        <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                    </button>
                </li>
                <li class="nav-item flex-grow-1">
                    <button class="nav-link fw-bold w-100" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPanel" type="button">
                        <i class="fas fa-user-plus me-2"></i>Registrarse
                    </button>
                </li>
            </ul>
            
            <div class="tab-content">
                <!-- Login Panel -->
                <div class="tab-pane fade show active" id="loginPanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-user me-1"></i> Usuario</label>
                            <input type="text" id="loginUsername" class="form-control" placeholder="Ingresa tu usuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-lock me-1"></i> Contraseña</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="Ingresa tu contraseña" required>
                        </div>
                        <div class="alert alert-info mb-3">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>Credenciales de prueba:</strong><br>
                            
                        </div>
                        <button type="submit" class="btn-gold mb-3" id="loginBtn">
                            <i class="fas fa-arrow-right-to-bracket me-2"></i>Ingresar
                        </button>
                    </form>
                </div>
                
                <!-- Register Panel -->
                <div class="tab-pane fade" id="registerPanel">
                    <form id="registerForm">
                        <!-- Usuario -->
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-user me-1"></i> Usuario</label>
                            <input type="text" id="regUser" class="form-control" placeholder="Ej: juan_perez" required>
                            <div class="invalid-feedback" id="userError"></div>
                            <div class="valid-feedback" id="userValid">✓ Usuario válido</div>
                        </div>
                        
                        <!-- Correo -->
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-envelope me-1"></i> Correo electrónico</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="tu@email.com" required>
                            <div class="invalid-feedback" id="emailError"></div>
                            <div class="valid-feedback" id="emailValid">✓ Correo válido</div>
                        </div>
                        
                        <!-- Teléfono -->
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fab fa-whatsapp me-1"></i> Teléfono (WhatsApp)</label>
                            <input type="tel" id="regPhone" class="form-control" placeholder="Ej: 521234567890" required>
                            <div class="invalid-feedback" id="phoneError"></div>
                            <div class="valid-feedback" id="phoneValid">✓ Teléfono válido</div>
                            <small class="text-muted">Formato: 521 + 10 dígitos</small>
                        </div>
                        
                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-lock me-1"></i> Contraseña</label>
                            <div class="input-group-custom">
                                <input type="password" id="regPassword" class="form-control" placeholder="Crea una contraseña" required>
                                <i class="fas fa-eye field-icon" id="togglePwd" style="cursor: pointer;"></i>
                            </div>
                            <div class="strength-meter">
                                <div class="strength-meter-fill" id="strengthFill"></div>
                            </div>
                            <div class="strength-text" id="strengthText"></div>
                            <div class="invalid-feedback" id="pwdError"></div>
                            <div class="valid-feedback" id="pwdValid">✓ Contraseña válida</div>
                        </div>
                        
                        <!-- Confirmar contraseña -->
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-check-circle me-1"></i> Confirmar contraseña</label>
                            <div class="input-group-custom">
                                <input type="password" id="regConfirmPassword" class="form-control" placeholder="Repite tu contraseña" required>
                                <i class="fas fa-eye field-icon" id="toggleConfirmPwd" style="cursor: pointer;"></i>
                            </div>
                            <div class="invalid-feedback" id="confirmError"></div>
                            <div class="valid-feedback" id="confirmValid">✓ Las contraseñas coinciden</div>
                        </div>
                        
                        <button type="submit" class="btn-gold" id="registerBtn">
                            <i class="fas fa-user-plus me-2"></i>Registrarse
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="back-link">
                <a href="/"><i class="fas fa-arrow-left me-1"></i> Volver a la tienda</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 <script  const express = require('express');
const bcrypt = require('bcrypt');
const jwt = require('jsonwebtoken');
const { getDb } = require('../db');
const { authenticateToken } = require('../middleware/auth');

const router = express.Router();
const JWT_SECRET = 'la-pomme-secret-key-2026';

// ==================== FUNCIONES DE VALIDACIÓN ====================

// Validar username (sin espacios, caracteres permitidos)
function validateUsername(username) {
    if (!username || username.trim() === '') {
        return { valid: false, message: 'El nombre de usuario es requerido' };
    }
    
    // Verificar que no contenga espacios
    if (username.includes(' ')) {
        return { valid: false, message: 'El nombre de usuario no puede contener espacios' };
    }
    
    // Verificar longitud mínima
    if (username.length < 3) {
        return { valid: false, message: 'El nombre de usuario debe tener al menos 3 caracteres' };
    }
    
    // Verificar caracteres permitidos (letras, números, guión bajo, punto)
    const validRegex = /^[a-zA-Z0-9_.]+$/;
    if (!validRegex.test(username)) {
        return { valid: false, message: 'El nombre de usuario solo puede contener letras, números, guión bajo (_) y punto (.)' };
    }
    
    return { valid: true };
}

// Validar email
function validateEmail(email) {
    if (!email) return { valid: true }; // Email es opcional
    
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        return { valid: false, message: 'El correo electrónico no es válido' };
    }
    
    return { valid: true };
}

// Validar y formatear número de teléfono mexicano
function validateAndFormatPhone(phone) {
    if (!phone || phone.trim() === '') {
        return { valid: false, message: 'El número de teléfono es requerido' };
    }
    
    // Limpiar el número: eliminar espacios, guiones, etc.
    let cleanPhone = phone.toString().replace(/[\s\-\(\)]/g, '');
    
    // Si ya tiene +52 al inicio, mantenerlo
    if (cleanPhone.startsWith('+52')) {
        cleanPhone = cleanPhone.substring(1); // Quitar el + para guardar
        if (/^52\d{10}$/.test(cleanPhone)) {
            return { valid: true, phone: cleanPhone };
        }
    }
    
    // Si ya tiene 52 al inicio (sin +)
    if (cleanPhone.startsWith('52') && /^52\d{10}$/.test(cleanPhone)) {
        return { valid: true, phone: cleanPhone };
    }
    
    // Si son 10 dígitos, agregar 52
    if (/^\d{10}$/.test(cleanPhone)) {
        return { valid: true, phone: '52' + cleanPhone };
    }
    
    // Formato inválido
    return { valid: false, message: 'Número de teléfono inválido. Debe ser un número mexicano de 10 dígitos (ej: 9381770841) o incluir 52 (ej: 529381770841)' };
}

// Validar contraseña
function validatePassword(password) {
    if (!password) {
        return { valid: false, message: 'La contraseña es requerida' };
    }
    
    if (password.length < 4) {
        return { valid: false, message: 'La contraseña debe tener al menos 4 caracteres' };
    }
    
    return { valid: true };
}

// ==================== REGISTRO DE USUARIO ====================
router.post('/register', async (req, res) => {
    const { username, email, phone, password } = req.body;
    const supabase = getDb();
    
    // 1. Validar username (sin espacios)
    const usernameValidation = validateUsername(username);
    if (!usernameValidation.valid) {
        return res.status(400).json({ 
            success: false, 
            message: usernameValidation.message 
        });
    }
    
    // 2. Validar email (si se proporciona)
    if (email) {
        const emailValidation = validateEmail(email);
        if (!emailValidation.valid) {
            return res.status(400).json({ 
                success: false, 
                message: emailValidation.message 
            });
        }
    }
    
    // 3. Validar teléfono
    const phoneValidation = validateAndFormatPhone(phone);
    if (!phoneValidation.valid) {
        return res.status(400).json({ 
            success: false, 
            message: phoneValidation.message 
        });
    }
    
    // 4. Validar contraseña
    const passwordValidation = validatePassword(password);
    if (!passwordValidation.valid) {
        return res.status(400).json({ 
            success: false, 
            message: passwordValidation.message 
        });
    }
    
    // Si no viene email, asignar por defecto
    const userEmail = email || `${username.trim().toLowerCase()}@usuario.com`;
    const formattedPhone = phoneValidation.phone;
    const cleanUsername = username.trim().toLowerCase();
    
    try {
        // Verificar si el username ya existe
        const { data: existingUser, error: findError } = await supabase
            .from('users')
            .select('username')
            .eq('username', cleanUsername)
            .maybeSingle();
        
        if (findError && findError.code !== 'PGRST116') throw findError;
        
        if (existingUser) {
            return res.status(400).json({ 
                success: false, 
                message: 'El nombre de usuario ya está en uso' 
            });
        }
        
        // Verificar si el teléfono ya existe
        const { data: existingPhone, error: phoneError } = await supabase
            .from('users')
            .select('phone')
            .eq('phone', formattedPhone)
            .maybeSingle();
        
        if (phoneError && phoneError.code !== 'PGRST116') throw phoneError;
        
        if (existingPhone) {
            return res.status(400).json({ 
                success: false, 
                message: 'El número de teléfono ya está registrado' 
            });
        }
        
        // Hashear contraseña
        const hashedPassword = await bcrypt.hash(password, 10);
        
        // Crear usuario
        const { data, error } = await supabase
            .from('users')
            .insert([{
                username: cleanUsername,
                email: userEmail,
                phone: formattedPhone,
                password: hashedPassword,
                role: 'user'
            }])
            .select();
        
        if (error) throw error;
        
        res.json({ 
            success: true, 
            message: 'Usuario registrado exitosamente',
            user: {
                id: data[0].id,
                username: data[0].username,
                email: data[0].email,
                phone: data[0].phone
            }
        });
        
    } catch (error) {
        console.error('Error en registro:', error);
        res.status(500).json({ success: false, message: error.message });
    }
});

// ==================== LOGIN ====================
router.post('/login', async (req, res) => {
    const { username, password } = req.body;
    const supabase = getDb();
    
    if (!username || !password) {
        return res.status(400).json({ 
            success: false, 
            message: 'Usuario y contraseña son requeridos' 
        });
    }
    
    try {
        const { data: users, error } = await supabase
            .from('users')
            .select('*')
            .eq('username', username.toLowerCase())
            .limit(1);
        
        if (error) throw error;
        
        const user = users?.[0];
        
        if (!user) {
            return res.status(401).json({ success: false, message: 'Credenciales inválidas' });
        }
        
        const validPassword = await bcrypt.compare(password, user.password);
        
        if (!validPassword) {
            return res.status(401).json({ success: false, message: 'Credenciales inválidas' });
        }
        
        const token = jwt.sign(
            { id: user.id, username: user.username, role: user.role },
            JWT_SECRET,
            { expiresIn: '7d' }
        );
        
        res.json({
            success: true,
            token,
            user: {
                id: user.id,
                username: user.username,
                email: user.email,
                phone: user.phone,
                role: user.role
            }
        });
    } catch (error) {
        console.error('Error en login:', error);
        res.status(500).json({ success: false, message: error.message });
    }
});

// ==================== CAMBIAR CONTRASEÑA ====================
router.post('/change-password', authenticateToken, async (req, res) => {
    const { currentPassword, newPassword } = req.body;
    const userId = req.user.id;
    const supabase = getDb();
    
    if (req.user.role === 'admin') {
        return res.status(403).json({ 
            success: false, 
            message: 'Los administradores no pueden cambiar su contraseña desde esta sección' 
        });
    }
    
    const passwordValidation = validatePassword(newPassword);
    if (!passwordValidation.valid) {
        return res.status(400).json({ success: false, message: passwordValidation.message });
    }
    
    try {
        const { data: users, error: findError } = await supabase
            .from('users')
            .select('*')
            .eq('id', userId)
            .maybeSingle();
        
        if (findError) throw findError;
        
        if (!users) {
            return res.status(404).json({ success: false, message: 'Usuario no encontrado' });
        }
        
        const validPassword = await bcrypt.compare(currentPassword, users.password);
        
        if (!validPassword) {
            return res.status(401).json({ success: false, message: 'Contraseña actual incorrecta' });
        }
        
        const hashedNewPassword = await bcrypt.hash(newPassword, 10);
        
        const { error: updateError } = await supabase
            .from('users')
            .update({ password: hashedNewPassword })
            .eq('id', userId);
        
        if (updateError) throw updateError;
        
        res.json({ success: true, message: 'Contraseña actualizada exitosamente' });
        
    } catch (error) {
        console.error('Error al cambiar contraseña:', error);
        res.status(500).json({ success: false, message: error.message });
    }
});

// ==================== VERIFICAR TOKEN ====================
router.post('/verify', async (req, res) => {
    const token = req.headers.authorization?.split(' ')[1];
    
    if (!token) {
        return res.status(401).json({ success: false, message: 'No token provided' });
    }
    
    try {
        const decoded = jwt.verify(token, JWT_SECRET);
        const supabase = getDb();
        
        const { data: users, error } = await supabase
            .from('users')
            .select('id, username, email, phone, role')
            .eq('id', decoded.id)
            .maybeSingle();
        
        if (error) throw error;
        
        if (!users) {
            return res.status(404).json({ success: false, message: 'User not found' });
        }
        
        res.json({ success: true, user: users });
    } catch (error) {
        res.status(401).json({ success: false, message: 'Invalid token' });
    }
});

// ==================== OBTENER PERFIL DE USUARIO ====================
router.get('/profile', authenticateToken, async (req, res) => {
    const supabase = getDb();
    const userId = req.user.id;
    
    try {
        const { data: user, error } = await supabase
            .from('users')
            .select('id, username, email, phone, role, created_at')
            .eq('id', userId)
            .maybeSingle();
        
        if (error) throw error;
        
        if (!user) {
            return res.status(404).json({ success: false, message: 'Usuario no encontrado' });
        }
        
        res.json({ success: true, user });
    } catch (error) {
        console.error('Error al obtener perfil:', error);
        res.status(500).json({ success: false, message: error.message });
    }
});

module.exports = router;
</script>
